# DFEI 固化探针 B — 551: v507 原位续训 20ep, lr 提到 3e-4 (10x, 上限端)
# 与 550(lr1e-4) 组成 lr 阶梯 {3e-5(v509 已证零漂移), 1e-4(550), 3e-4(551)}。
# 判读: 若 551 仍 ≈ v507(34.02/19.62) 且 val 不降 -> 真固化;
#       若明显更差 -> 当前点"尖锐", 高 lr 破坏已学解, 需温和探索而非大步;
#       若更好 -> 此前 REJECT 是 lr 太小, 不是固化。
settings:
  data_dir: /lzufs/user/guoqingxiang/DFEI_IFT_20260702/data/MC_normed
  sample: [inclusive_00342442]
  nfiles: [200]
  precision: 32
  batch_size: 8
  lr: 3.0e-04
  weight_decay: 1.0e-05
  epochs: 20
  gacc: 2
  ngpu: 1
  ncpu: 2
  graph_mode: None
  node_sel: 'true'
  pv_model: None
  calibration: false
