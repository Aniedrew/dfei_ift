settings:
  # v38 栈 + latent 容量升级 (asym: tracks 32 / tt 边 24) + 部分继承 —— 单变量实验
  # 背景: v53 (asym+mass, 从0, 150ep) 失败 = 同时混了 容量/从0/新头 三个变量,
  #   class3 全灭 (pred3=0%), Perfect 24.18. asym 假说未被证伪.
  # 本实验只动"容量"一个变量: encoder/GNblocks/decoder 的 tracks 16→32、tt 边 16→24,
  #   inference 栈与 v38 完全一致 (无 mass head, 无 attention).
  # 起点: v38 best (cpt=38) 部分继承 —— 与 tracks/tt 维度耦合的层 (各类型末层 128→32/24
  #   及下游头输入层) shape 不匹配, 随机初始化重学; 其余权重 (128 维中间层等) 完整继承
  #   (load_state_dict 已兼容 shape mismatch, 见 dfei_lightning_module.load_state_dict).
  # 预算: 20ep 微调探针 (同 v510/消融链口径), 对照 v38 (Perfect 29.26 / All ~50.6).
  data_dir: "/lzufs/user/guoqingxiang/DFEI_IFT_20260702/data/MC_normed"
  sample: [ "inclusive_00342442" ]
  nfiles: [ 200 ]
  precision: 32
  batch_size: 8
  lr: 3e-5
  weight_decay: 1e-5
  epochs: 20
  gacc: 2
  ngpu: 1
  ncpu: 2
  graph_mode: "None"
  node_sel: "true"
  pv_model: "None"
  calibration: False
  log_version: 512

inference:
  LCA: true
  LCA_weights: true
  node_prune: true
  node_prune_weights: true
  edge_prune: true
  edge_prune_weights: true
  pv_asso: true
  pv_asso_weights: true
  edge_prune_thr: 0.9
  node_prune_thr: 0.9
  node_prune_weight: 10.0
  lca_weight: 10.0
  lca_class2_weight: 2.0
  chain_lca_loss: true
  chain_lca_loss_weight: 2.0
  chain_lca_margin: 0.3
  chain_lca_ce: true
  chain_lca_ce_weight: 1.0
  source_head: true
  source_head_node_dim: 32   # 节点表征升到 32 维
  source_loss_weight: 5.0
  chain_lca_filter: false
  chain_lca_conf_thr: 0.3
  # 无 mass head / struct / mom —— 与 v38 栈对照 (消融链结果出来后再叠)

evaluate:
  sample: [ "inclusive_00342442" ]
  nfiles: [ 20 ]
  over_write: "v38_asym_up"

DFEI:
  use_pid: "true"
  cpt: 38
  node_types: [ 'tracks', 'pvs' ]
  edge_types: [ "tracks_tracks", "tracks_pvs" ]
  encoder:
    usage: true
    global: { layers: [ -1, 128, 128, 16 ], norm: [ "graph_norm", "None" ], dropout: 0.01 }
    tracks: { layers: [ -1, 128, 128, 32 ], norm: [ "graph_norm", "None" ], dropout: 0.01 }  # 16→32
    pvs: { layers: [ -1, 128, 128, 16 ], norm: [ "graph_norm", "None" ], dropout: 0.01 }
    tracks_tracks: { layers: [ -1, 128, 128, 24 ], norm: [ "graph_norm", "None" ], dropout: 0.01 }  # 16→24
    tracks_pvs: { layers: [ -1, 128, 128, 16 ], norm: [ "graph_norm", "None" ], dropout: 0.01 }
  GNblocks:
    nBlocks: 4
    use_globals: true
    use_node_weights: true
    use_edge_weights: true
    weighted_pass: true
    MLP_forward: { layers: [ -1, 128, 128, 16 ], norm: "None", dropout: 0.01 }
    MLP_forward_dim: { tracks: 32, tracks_tracks: 24 }   # 不对称: 节点 32, tt 边 24
    MLP_infer: { layers: [ -1, 16, 16, 16, 1 ], norm: "None", dropout: 0.01 }
    b2: true
    b2_cut: 0.85
    b2_k: 0
    b2_tau_start: 1.0
    b2_tau_end: 0.1
    b2_tau_epochs: 100
  decoder:
    usage: True
    global: { layers: [ -1, 128, 128, 16 ], norm: [ "None", "None" ], dropout: 0.01 }
    tracks: { layers: [ -1, 128, 128, 32 ], norm: [ "None", "None" ], dropout: 0.01 }  # 16→32
    pvs: { layers: [ -1, 128, 128, 16 ], norm: [ "None", "None" ], dropout: 0.01 }
    tracks_tracks: { layers: [ -1, 128, 128, 24 ], norm: [ "None", "None" ], dropout: 0.01 }  # 16→24
    tracks_pvs: { layers: [ -1, 128, 128, 16 ], norm: [ "None", "None" ], dropout: 0.01 }
  op_trafo:
    usage: true
    tr_tr: 4
    tr_pv: None
    tr: None
    pv: None
    global: None
    MLP: { layers: [ -1, -1 ], norm: "None", dropout: 0.01 }
