# 世代法 世代1: v47 (mass head 已吸收) + struct head — 单头世代吸收.
# 对照 v48 (v38_structhead) 失败: resume v47 best 只续 17ep + struct+mom 两头同加 → All 50.6。
# 世代法差异: ① 只加一个头 (struct); ② 预算 67ep (epochs=180, resume v47 ep113 → 续到 179);
#   struct 头从 v47 权重继承, 仅缺 node_struct_head → 随机初始化, optimizer 重置 (on_load_checkpoint)。
# mass head 保留 (世代继承). 不加 attention (与 v517 世代线分开, 纯监督头单变量)。
# 接受判据: best thr0.9 > v47 (Perfect 32.7/All 55.9) → 则下世代 +mom; 否则 struct 世代收束。
settings:
  batch_size: 8
  calibration: false
  data_dir: /lzufs/user/guoqingxiang/DFEI_IFT_20260702/data/MC_normed
  epochs: 180
  gacc: 2
  graph_mode: None
  lr: 3e-5
  ncpu: 2
  nfiles:
  - 200
  ngpu: 1
  node_sel: 'true'
  precision: 32
  pv_model: None
  sample:
  - inclusive_00342442
  weight_decay: 1e-5
  log_version: 520
  early_stop_patience: 0  # 世代长训跑满 180ep 预算, 禁用 val_combined_loss 早停
  resume_ckpt: "/lzufs/home/guoqingxiang/dfei/scalable_mtl_hgnn/LHCb_logs/DFEI/version_518/checkpoints/epoch_epoch=131.ckpt"

inference:
  LCA: true
  LCA_weights: true
  chain_lca_ce: true
  chain_lca_ce_weight: 1.0
  chain_lca_conf_thr: 0.3
  chain_lca_filter: false
  chain_lca_loss: true
  chain_lca_loss_weight: 2.0
  chain_lca_margin: 0.3
  edge_prune: true
  edge_prune_thr: 0.9
  edge_prune_weights: true
  lca_class2_weight: 2.0
  lca_weight: 10.0
  mass_head: true
  mass_head_edge_dim: 16
  mass_loss_weight: 1.0
  # ==== 世代1 新增: struct head (depth + RC 连续结构监督) ====
  struct_head: true
  struct_head_node_dim: 16
  struct_head_weight: 1.0
  rc_head_weight: 0.5
  node_prune: true
  node_prune_thr: 0.9
  node_prune_weight: 10.0
  node_prune_weights: true
  pv_asso: true
  pv_asso_weights: true
  source_head: true
  source_loss_weight: 5.0

evaluate:
  nfiles:
  - 20
  over_write: v48_struct_gen
  sample:
  - inclusive_00342442

DFEI:
