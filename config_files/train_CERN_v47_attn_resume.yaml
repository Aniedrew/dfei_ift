# v515 (v47+attention) 续训诊断 — 区分"20ep 预算不足" vs "机制冲突"
# v515 (31.6/53.8) < v47 (32.7/55.9)。若是纯预算问题 (attention/mass 拉锯未稳定),
# 长训应能超过 v47; 若仍 < v47 → 坐实"后插 attention 到固化 mass 态"机制冲突, 转世代法。
# resume 自 version_515 epoch_epoch=19, 续 60ep (epochs=80, PL 从 ep19 继续到 79)。
