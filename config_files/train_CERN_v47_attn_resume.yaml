  batch_size: 8
  calibration: false
  data_dir: /lzufs/user/guoqingxiang/DFEI_IFT_20260702/data/MC_normed
  epochs: 80
  gacc: 2
  graph_mode: None
  lr: 3e-5
  ncpu: 2
  nfiles:
  - 200
  ngpu: 1
  node_sel: 'true'
  precision: 32
  pv_model: None
  sample:
  - inclusive_00342442
  weight_decay: 1e-5
  log_version: 516
  resume_ckpt: "/lzufs/home/guoqingxiang/dfei/scalable_mtl_hgnn/LHCb_logs/DFEI/version_515/checkpoints/epoch_epoch=19.ckpt"

