settings:
  # 公开 LHCb 碰撞数据 (无 PID / 无粒子键)
  data_dir: "/lzufs/user/guoqingxiang/DFEI_data/converted_LHCbcollision"
  sample: [ "00342442_inclusive" ]
  nfiles: [ 50 ]
  model_arch: "DFEI"
  model: 27
  ngpu: 1
  ncpu: 4
  graph_mode: "None"
  node_sel: "true"
  pv_model: "None"
  calibration: False

inference:
  LCA: true
  LCA_weights: true
  node_prune: true
  node_prune_weights: true
  edge_prune: true
  edge_prune_weights: true
  pv_asso: true
  pv_asso_weights: true
  # 无剪枝 (阈值取负 -> 全保留): 用于统计公开数据线的固定分母 N_total_public
  edge_prune_thr: -1.0
  node_prune_thr: -1.0

evaluate:
  sample: [ "00342442_inclusive" ]
  nfiles: [ 50 ]
  over_write: "noprune_public"
