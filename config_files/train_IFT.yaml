# Global settings
settings:
  # Input file information
  data_dir: "/lzufs/user/guoqingxiang/DFEI_data/converted_LHCbcollision" # Local converted data
  sample: [ "00342442_inclusive" ]  # We only have the inclusive sample
  nfiles: [ 50 ]  # 50 trn_data_*.zst files
  # Training settings
  batch_size: 64
  lr: 1e-3
  weight_decay: 1e-5
  epochs: 100
  gacc: 1  # Accumulating number of mini batches before step
  ngpu: 1  # Number of GPUs used for training
  ncpu: 8  # Number CPUs used for multithreading/data loader,
  # Preselection filters
  graph_mode: "None"  # Apply pruning on initial graph: "true", "true_frag" "None"
  node_sel: "true"  # Pruner used to apply the graph mode above: "true", "zeros", "default"
  pv_model: "None" # No trained DFEI model yet; use "None" to skip PV association

inference:
  FT: True
  FT_weights: False
  frag: False
  frag_weights: False
  # fragmentation inference is decapitated and was pythia simulation exclusive
  # Defining thresholds to remove bkg edges and nodes before reconstruction
  edge_prune_thr: 0.9  # Edge prune threshold during reco
  node_prune_thr: 0.9  # Node prune threshold during reco


evaluate:
  sample: [ "00342442_inclusive" ]
  nfiles: [ 50 ]
  over_write: "" # argument to overwrite the output names to rerun safely the same sample: "" for no overwrite


IFT:
  dfei_model: "None" # DFEI model which is used within IFT: "None", "DFEI_version_number"
  use_pid: "true" # Adding pid information in DFEI model: "None", "true", "realistic"
  cpt: None # Loading checkpoint to continue training: None, DFEI_version_number, "path.ckpt"
  node_types: [ 'tracks', 'pvs' ]  # Graph node settings
  edge_types: [ "tracks_tracks", "tracks_pvs" ]  # Graph edge settings
  encoder:
    usage: True
    global:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ] # pass single string or [layers - 2 specific norms]
      dropout: 0.01 # pass single float or [layers - 1 specific dropout values]
    tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ]
      dropout: 0.01
    pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ]
      dropout: 0.01
    tracks_tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ]
      dropout: 0.01
    tracks_pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ]
      dropout: 0.01
  GNblocks:
    nBlocks: 2
    use_globals: True
    use_node_weights: True # MLP to infer a node weight, also necessary for node pruning
    use_edge_weights: True # MLP to infer an edge weight, also necessary for edge pruning
    weighted_pass: True # Whether to pass the weights, requires above
    MLP_forward:
      layers: [ -1, 128, 128, 16 ]
      norm: "graph_norm"
      dropout: 0.01
    MLP_infer:
      layers: [ -1, 16, 16, 16, 1 ]
      norm: "graph_norm"
      dropout: 0.01
  decoder:
    usage: True
    global:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ] # pass single string or [layers - 2 specific norms]
      dropout: 0.01 # pass single float or [layers - 1 specific dropout values]
    tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ]
      dropout: 0.01
    pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ]
      dropout: 0.01
    tracks_tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ]
      dropout: 0.01
    tracks_pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "graph_norm" ]
      dropout: 0.01
  op_trafo: # transforms output to desired dimension
    usage: True
    tr_tr: None
    tr_pv: None
    tr: 3  # FT output
    pv: None
    global: None
    MLP:
      layers: [ -1, -1 ]
      norm: "graph_norm"
      dropout: 0.01
