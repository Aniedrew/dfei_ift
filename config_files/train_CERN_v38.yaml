settings:
  # Input file information - 新CERN标准化MC数据
  data_dir: "/lzufs/user/guoqingxiang/DFEI_IFT_20260702/data/MC_normed"
  sample: [ "inclusive_00342442" ]
  nfiles: [ 200 ]
  # Training settings
  precision: 32
  batch_size: 8
  lr: 3e-5  # 微调续训: 比 v37(5e-5) 更低, 保护已学表征
  weight_decay: 1e-5
  epochs: 150
  gacc: 2
  ngpu: 1
  ncpu: 2
  # Preselection filters
  graph_mode: "None"
  node_sel: "true"
  pv_model: "None"
  calibration: False
  # 起点: v37 best (ep90, val 35.562; B2 cut0.7 + class2加权3.0 + chain_lca_loss)
  resume_ckpt: "/lzufs/home/guoqingxiang/dfei/scalable_mtl_hgnn/LHCb_logs/DFEI/version_37/checkpoints/best-epoch=90-val_combined_loss=35.562.ckpt"

inference:
  LCA: true
  LCA_weights: true
  node_prune: true
  node_prune_weights: true
  edge_prune: true
  edge_prune_weights: true
  pv_asso: true
  pv_asso_weights: true
  # 推理剪枝阈值: 训练时不用 (B2 软掩码), 评估时用. 0.9 = 同口径对比基线
  edge_prune_thr: 0.9
  node_prune_thr: 0.9
  # ==== Loss 再平衡 (tt_edges 占 91%, node/LCA 欠投入) ====
  node_prune_weight: 10.0   # w_node
  lca_weight: 10.0          # w_lca
  # ==== 方案4(改良): class2 加权 3.0 -> 2.0 ====
  # v37 实验证明 3.0 过度: class2 反而从 v36 47.7% 降到 44.2% (大量被判成 class1);
  # 2.0 适度放大, 平衡 class1/2 判别力。
  lca_class2_weight: 2.0
  # ==== 方案5: 链内 LCA 一致性辅助损失 (保持) ====
  chain_lca_loss: true      # 鼓励 truth 链内边高置信, 压低 NoneIso
  chain_lca_loss_weight: 2.0
  chain_lca_margin: 0.3
  # ==== 方案6(新增): 链内边"类别正确"监督 ====
  # 对链内边 (y>0, 仅 ~0.1%) 额外施加 LCA 类别 CE, 对抗 class0 对主 loss 的稀释;
  # 链内边分类错误 (class2<->class1) 直接破坏链结构, 是 Perfect 的结构瓶颈。
  chain_lca_ce: true
  chain_lca_ce_weight: 1.0
  # ==== 源检测辅助头 (Rumor Centrality 训练化, 保持) ====
  source_head: true
  source_loss_weight: 5.0
  # ==== 链级 LCA 物理判据 (推理后处理, 训练时关闭) ====
  chain_lca_filter: false
  chain_lca_conf_thr: 0.3

evaluate:
  sample: [ "inclusive_00342442" ]
  nfiles: [ 20 ]
  over_write: "v38_b2_cl2_chaince"

DFEI:
  use_pid: "true"
  cpt: None  # 权重由 resume_ckpt 恢复
  node_types: [ 'tracks', 'pvs' ]
  edge_types: [ "tracks_tracks", "tracks_pvs" ]
  encoder:
    usage: true
    global:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    tracks_tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    tracks_pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
  GNblocks:
    nBlocks: 4
    use_globals: true
    use_node_weights: true
    use_edge_weights: true
    weighted_pass: true
    MLP_forward:
      layers: [ -1, 128, 128, 16 ]
      norm: "None"
      dropout: 0.01
    MLP_infer:
      layers: [ -1, 16, 16, 16, 1 ]
      norm: "None"
      dropout: 0.01
    # ==== 方案4(改良): B2 软掩码 cut 0.7 -> 0.85 ====
    # 对齐推理硬阈值 0.9 (训练剪更狠, 消除 train-inference gap 的剩余偏差)
    b2: true
    b2_cut: 0.85
    b2_k: 0            # 纯阈值软掩码, 不用 top-k (F 教训)
    b2_tau_start: 1.0
    b2_tau_end: 0.1
    b2_tau_epochs: 100
  decoder:
    usage: True
    global:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    tracks_tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    tracks_pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
  op_trafo:
    usage: true
    tr_tr: 4
    tr_pv: None
    tr: None
    pv: None
    global: None
    MLP:
      layers: [ -1, -1 ]
      norm: "None"
      dropout: 0.01
