# DFEI 复现 (2026-09-15) — lv563  cpt=551  lr=0.0003  20ep
# 目的: v557 与同基底对照 v559 的 Perfect 差仅 93 个 (噪声 ±75), All 差 +347 是稳的。
#       本 arm 与 v557 逐位同配置, 只换 log_version -> 判定 Perf 增益是真还是噪声。
