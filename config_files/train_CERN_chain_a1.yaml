# DFEI 累加保留链 — A1 (= CERN v36): + B2(b2_cut 0.5) + source head
# 与"贪心消融链"不同: 本链每步成组叠加、全部保留、不做单项回退 (严格复刻 v31→v47 的累加路径).
# 起点 = v500 (v31 + rebal, ACCEPT 基线)。A1 成组加 v36 配方: B2 + 源检测头.
# 后续 A2(=v37)/A3(=v38)/A4(=v47) 依次续训本链上一步, 无论单步结果如何都保留.
settings:
  data_dir: /lzufs/user/guoqingxiang/DFEI_IFT_20260702/data/MC_normed
  sample: [inclusive_00342442]
  nfiles: [200]
  precision: 32
  batch_size: 8
  lr: 3.0e-05
  weight_decay: 1.0e-05
  epochs: 20
  gacc: 2
  ngpu: 1
  ncpu: 2
  graph_mode: None
  node_sel: 'true'
  pv_model: None
  calibration: false
  log_version: 530
inference: {LCA: true, LCA_weights: true, node_prune: true, node_prune_weights: true,
  edge_prune: true, edge_prune_weights: true, pv_asso: true, pv_asso_weights: true,
  edge_prune_thr: 0.9, node_prune_thr: 0.9,
  source_head: true, source_loss_weight: 5.0}
evaluate:
  sample: [inclusive_00342442]
  nfiles: [20]
  over_write: chain_a1
DFEI:
  GNblocks:
    MLP_forward:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: None
    MLP_infer:
      dropout: 0.01
      layers: [-1, 16, 16, 16, 1]
      norm: None
    nBlocks: 4
    use_edge_weights: true
    use_globals: true
    use_node_weights: true
    weighted_pass: true
    # ==== CERN v36: B2 可微剪枝 (cut 0.5) ====
    b2: true
    b2_cut: 0.5
    b2_k: 0
    b2_tau_start: 1.0
    b2_tau_end: 0.1
    b2_tau_epochs: 20
  decoder:
    global:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [None, None]
    pvs:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [None, None]
    tracks:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [None, None]
    tracks_pvs:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [None, None]
    tracks_tracks:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [None, None]
    usage: true
  edge_types: [tracks_tracks, tracks_pvs]
  encoder:
    global:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [graph_norm, None]
    pvs:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [graph_norm, None]
    tracks:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [graph_norm, None]
    tracks_pvs:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [graph_norm, None]
    tracks_tracks:
      dropout: 0.01
      layers: [-1, 128, 128, 16]
      norm: [graph_norm, None]
    usage: true
  node_types: [tracks, pvs]
  op_trafo:
    MLP:
      dropout: 0.01
      layers: [-1, -1]
      norm: None
    global: None
    pv: None
    tr: None
    tr_pv: None
    tr_tr: 4
    usage: true
  use_pid: 'true'
  cpt: 500
