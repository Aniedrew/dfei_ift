settings:
  # 公开LHCb碰撞数据 (论文 DFEI, arXiv:2304.08610)
  data_dir: "/lzufs/user/guoqingxiang/DFEI_data/converted_LHCbcollision"
  sample: [ "00342442_inclusive" ]
  nfiles: [ 50 ]  # 50 个 tst 文件
  # Model to evaluate
  model_arch: "DFEI"
  model: 45  # 公开数据 v38 (version_45), 自动加载 val 最小的 best ckpt (ep51, 33.223)
  # Hardware
  ngpu: 1
  ncpu: 4
  # Preselection filters (must match training config)
  graph_mode: "None"
  node_sel: "true"
  pv_model: "None"
  calibration: False

inference:
  LCA: true
  LCA_weights: true
  node_prune: true
  node_prune_weights: true
  edge_prune: true
  edge_prune_weights: true
  pv_asso: true
  pv_asso_weights: true
  # 与训练同口径: thr 0.9
  edge_prune_thr: 0.9
  node_prune_thr: 0.9

evaluate:
  sample: [ "00342442_inclusive" ]
  nfiles: [ 50 ]
  over_write: "v38_public_best"

DFEI:
  use_pid: "None"
  cpt: 45  # version number, will be overwritten by settings.model
  node_types: [ 'tracks', 'pvs' ]
  edge_types: [ "tracks_tracks", "tracks_pvs" ]
  encoder:
    usage: true
    global:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    tracks_tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    tracks_pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
  GNblocks:
    nBlocks: 4
    use_globals: true
    use_node_weights: true
    use_edge_weights: true
    weighted_pass: true
    MLP_forward:
      layers: [ -1, 128, 128, 16 ]
      norm: "None"
      dropout: 0.01
    MLP_infer:
      layers: [ -1, 16, 16, 16, 1 ]
      norm: "None"
      dropout: 0.01
    b2: true
    b2_cut: 0.85
  decoder:
    usage: True
    global:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    tracks_tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    tracks_pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
  op_trafo:
    usage: true
    tr_tr: 4
    tr_pv: None
    tr: None
    pv: None
    global: None
    MLP:
      layers: [ -1, -1 ]
      norm: "None"
      dropout: 0.01
