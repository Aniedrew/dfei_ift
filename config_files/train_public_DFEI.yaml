settings:
  # Input file information - 公开LHCb碰撞数据
  data_dir: "/lzufs/user/guoqingxiang/DFEI_data/converted_LHCbcollision"
  sample: [ "00342442_inclusive" ]
  nfiles: [ 50 ]  # 50个trn文件
  # Training settings
  precision: 32  # FP32 (FP16 produces NaN for this data, see version_22)
  batch_size: 1  # FP32 requires batch=1 for public data (~150 tracks/evt)
  lr: 1e-3
  weight_decay: 1e-5
  epochs: 100
  gacc: 16  # Effective batch remains 1*16=16 (same as version_14 which reached 0.902)
  ngpu: 1  # Number of GPUs used for training
  ncpu: 2  # Reduced to avoid DataLoader worker deadlock
  # Preselection filters
  graph_mode: "None"  # Apply pruning on initial graph: "true", "true_frag" "None"
  node_sel: "true"  # Pruner used to apply the graph mode above: "true", "zeros", "default"
  pv_model: "None" # Initial PV association: DFEI_model_number, "true", "ip", "None"
  calibration: False

inference:
  LCA: true
  LCA_weights: true
  node_prune: true
  node_prune_weights: true
  edge_prune: true
  edge_prune_weights: true
  pv_asso: true
  pv_asso_weights: true
  # Defining thresholds to remove bkg edges and nodes before reconstruction
  edge_prune_thr: 0.9  # Edge prune threshold during reco
  node_prune_thr: 0.9  # Node prune threshold during reco


evaluate:
  sample: [ "00342442_inclusive" ]
  nfiles: [ 50 ]  # 50 tst_data_*.zst files
  over_write: "" # argument to overwrite the output names to rerun safely the same sample: "" for no overwrite


DFEI:
  use_pid: "None"  # 公开数据不含PID信息
  cpt: None # Loading checkpoint to continue training: None, DFEI_version_number, "path.ckpt"
  node_types: [ 'tracks', 'pvs' ]  # Graph node settings
  edge_types: [ "tracks_tracks", "tracks_pvs" ]  # Graph edge settings
  encoder:
    usage: true
    global:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ] # pass single string or [layers - 2 specific norms]
      dropout: 0.01 # pass single float or [layers - 1 specific dropout values]
    tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    tracks_tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
    tracks_pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "graph_norm", "None" ]
      dropout: 0.01
  GNblocks:
    nBlocks: 4
    use_globals: true
    use_node_weights: true # MLP to infer a node weight, also necessary for node pruning
    use_edge_weights: true # MLP to infer an edge weight, also necessary for edge pruning
    weighted_pass: true # Whether to pass the weights, requires above
    MLP_forward:
      layers: [ -1, 128, 128, 16 ]
      norm: "None"
      dropout: 0.01
    MLP_infer:
      layers: [ -1, 16, 16, 16, 1 ]
      norm: "None"
      dropout: 0.01
  decoder:
    usage: True
    global:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ] # pass single string or [layers - 2 specific norms]
      dropout: 0.01 # pass single float or [layers - 1 specific dropout values]
    tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    tracks_tracks:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
    tracks_pvs:
      layers: [ -1, 128, 128, 16 ]
      norm: [ "None", "None" ]
      dropout: 0.01
  op_trafo: # transforms output to desired dimension
    usage: true
    tr_tr: 4  # Output dim of edges, 4 for LCA edges
    tr_pv: None
    tr: None
    pv: None
    global: None
    MLP:
      layers: [ -1, -1 ]
      norm: "None"
      dropout: 0.01
