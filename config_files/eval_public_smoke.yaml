settings:
  # Data directory for test data - 公开LHCb碰撞数据
  data_dir: "/lzufs/user/guoqingxiang/DFEI_data/converted_LHCbcollision"
  sample: [ "00342442_inclusive" ]
  nfiles: [ 2 ]  # 冒烟测试: 只跑2个tst文件
  # Model to evaluate
  model_arch: "DFEI"
  model: 23  # version_23 (公开数据 FP32 训练)
  # Hardware
  ngpu: 1
  ncpu: 4
  # Preselection filters (must match training config)
  graph_mode: "None"
  node_sel: "true"
  pv_model: "None"
  calibration: False

inference:
  LCA: true
  LCA_weights: true
  node_prune: true
  node_prune_weights: true
  edge_prune: true
  edge_prune_weights: true
  pv_asso: true
  pv_asso_weights: true
  # 论文 tight pruning: 阈值 0.2
  edge_prune_thr: 0.2
  node_prune_thr: 0.2

evaluate:
  sample: [ "00342442_inclusive" ]
  nfiles: [ 2 ]
  over_write: "smoke"

DFEI:
  use_pid: "None"  # 公开数据不含PID, 与训练配置一致
  cpt: 23  # version number, will be overwritten by settings.model
  node_types: [ 'tracks', 'pvs' ]
  edge_types: [ "tracks_tracks", "tracks_pvs" ]
